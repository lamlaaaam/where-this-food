name: Generate daily puzzle

on:
  # 16:07 UTC = 00:07 SGT. Generates a five-day window (today + next four days).
  # GitHub Actions can delay scheduled runs, but previous runs already generated
  # the next few days, so players always have a puzzle to load.
  schedule:
    - cron: '7 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-puzzle
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate puzzle window (SGT)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.PLACES_API_KEY }}
          PUZZLE_WINDOW_DAYS: '3'
        run: node scripts/generateDailyPuzzle.mjs

      - name: Commit puzzles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/puzzles public/photos
          if git diff --cached --quiet; then
            echo "No puzzle changes"
          else
            git commit -m "Update daily puzzle window"
            git push
          fi
