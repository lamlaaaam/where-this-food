name: Generate daily puzzle

on:
  # 15:50 UTC = 11:50 PM SGT. Generate tomorrow's puzzle before the midnight reset.
  schedule:
    - cron: '50 15 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate puzzle for tomorrow (SGT)
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          PUZZLE_DATE_OFFSET_DAYS: '1'
        run: node scripts/generateDailyPuzzle.mjs

      - name: Commit puzzle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/daily-puzzle.json
          if git diff --cached --quiet; then
            echo "No puzzle changes"
          else
            git commit -m "Update daily puzzle"
            git push
          fi
